name: Renderer palette source

on:
  push:
    paths:
      - "CHATGPT_PROJECT_POINTER.md"
      - "data/music-theory/tonality-colors.json"
      - "docs/chatgpt/RENDERERS_SOURCE_OF_TRUTH_V1.md"
      - "docs/chatgpt/PALETTE_TONALITES_ACCORDS_GAMMES_V1.md"
      - "tools/piano_chord_renderer/README.md"
      - "tools/piano_chord_renderer/RENDERER_POLICY.md"
      - "tools/piano_chord_renderer/piano_chord_renderer.py"
      - "tools/piano_chord_renderer/test_renderer.py"
      - "tools/piano_scale_renderer/README.md"
      - "tools/piano_scale_renderer/RENDERER_POLICY.md"
      - "tools/piano_scale_renderer/SOURCE_IMAGES_GAMMES_PIANO_V1.8.md"
      - "tools/piano_scale_renderer/piano_scale_renderer.py"
      - "tools/piano_scale_renderer/test_renderer.py"
      - "tools/piano_scale_renderer/test_pentatonic_renderer.py"
      - "tests/test_renderer_palette_source.py"
  pull_request:
    paths:
      - "CHATGPT_PROJECT_POINTER.md"
      - "data/music-theory/tonality-colors.json"
      - "docs/chatgpt/RENDERERS_SOURCE_OF_TRUTH_V1.md"
      - "docs/chatgpt/PALETTE_TONALITES_ACCORDS_GAMMES_V1.md"
      - "tools/piano_chord_renderer/**"
      - "tools/piano_scale_renderer/**"
      - "tests/test_renderer_palette_source.py"
      - ".github/workflows/renderer-palette-source.yml"

concurrency:
  group: renderer-palette-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest -v tests/test_renderer_palette_source.py
