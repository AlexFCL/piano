name: Generate chord assets

on:
  push:
    branches:
      - master
    paths:
      - "tools/piano_chord_renderer/piano_chord_renderer.py"
      - "tools/piano_chord_renderer/official_template.png"
      - "tools/piano_chord_renderer/requirements.txt"
      - "data/music-theory/tonality-colors.json"
  workflow_dispatch:

concurrency:
  group: chord-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/piano_chord_renderer/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-roboto

      - name: Run chord renderer tests
        working-directory: tools/piano_chord_renderer
        run: python -m unittest -v test_renderer.py

      - name: Generate all 102 chord PNGs
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          repo = Path.cwd()
          tool = repo / "tools" / "piano_chord_renderer"
          sys.path.insert(0, str(tool))

          from piano_chord_renderer import ROOT_ORDER, render_chord

          template = tool / "official_template.png"
          colors = repo / "data" / "music-theory" / "tonality-colors.json"
          output = repo / "images" / "Chords"
          output.mkdir(parents=True, exist_ok=True)

          inversion_names = {0: "fond", 1: "1er", 2: "2eme"}
          quality_names = {"major": "majeur", "minor": "mineur"}

          reports = {}
          for root in ROOT_ORDER:
              for quality in ("major", "minor"):
                  for inversion in (0, 1, 2):
                      filename = f"{root}-{quality_names[quality]}-{inversion_names[inversion]}.png"
                      report = render_chord(
                          template,
                          colors,
                          root,
                          quality,
                          inversion,
                          output / filename,
                      )
                      reports[filename] = report

          expected = len(ROOT_ORDER) * 2 * 3
          if len(reports) != expected:
              raise SystemExit(f"Expected {expected} rendered chords, got {len(reports)}")

          (tool / "validation-report.json").write_text(
              json.dumps(reports, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Generated {len(reports)} chord PNGs")
          PY

      - name: Validate generated asset set
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = ["C", "D", "E", "F", "G", "A", "B", "C#", "Db", "D#", "Eb", "F#", "Gb", "G#", "Ab", "A#", "Bb"]
          qualities = ["majeur", "mineur"]
          inversions = ["fond", "1er", "2eme"]
          directory = Path("images/Chords")

          missing = [
              f"{root}-{quality}-{inversion}.png"
              for root in roots
              for quality in qualities
              for inversion in inversions
              if not (directory / f"{root}-{quality}-{inversion}.png").exists()
          ]
          if missing:
              raise SystemExit("Missing chord assets: " + ", ".join(missing))

          generated = list(directory.glob("*-majeur-*.png")) + list(directory.glob("*-mineur-*.png"))
          if len(generated) != 102:
              raise SystemExit(f"Expected 102 generated PNGs, found {len(generated)}")

          print("All 102 generated chord assets are present.")
          PY

      - name: Commit generated chord assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/Chords/*.png
          if git diff --cached --quiet; then
            echo "Chord assets already up to date."
          else
            git commit -m "Generate canonical chord PNG assets"
            git push
          fi
