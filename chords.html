<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices — Générateur d'accords</title>
    <link rel="stylesheet" href="css/chords_styles.css?v=20261001-layout2">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="index.html">Exercices</a>
            <a class="header-link" href="index.html">← Retour</a>
        </header>

        <main class="training-layout">
            <div class="training-heading">
                <div>
                    <p class="eyebrow">Générateur d'accords</p>
                    <h1>À toi de jouer</h1>
                </div>

                <label class="time-control" for="update-time">
                    <span>Temps de réponse</span>
                    <span class="time-input">
                        <input id="update-time" type="number" min="1" step="0.5" value="5" inputmode="decimal" aria-describedby="controls-hint">
                        <span aria-hidden="true">s</span>
                    </span>
                </label>
            </div>

            <section class="filter-panel" aria-label="Sélection des accords">
                <div class="filter-group">
                    <span class="filter-label">Type d'accord</span>
                    <div class="filter-buttons" role="group" aria-label="Types d'accords">
                        <button class="filter-button is-active" type="button" data-filter-group="quality" data-value="majeur" aria-pressed="true">Majeur</button>
                        <button class="filter-button is-active" type="button" data-filter-group="quality" data-value="mineur" aria-pressed="true">Mineur</button>
                    </div>
                </div>

                <div class="filter-group filter-group--wide">
                    <span class="filter-label">Position</span>
                    <div class="filter-buttons filter-buttons--three" role="group" aria-label="Positions de l'accord">
                        <button class="filter-button is-active" type="button" data-filter-group="inversion" data-value="fond" aria-pressed="true">Fondamental</button>
                        <button class="filter-button is-active" type="button" data-filter-group="inversion" data-value="1er" aria-pressed="true">1er renversement</button>
                        <button class="filter-button is-active" type="button" data-filter-group="inversion" data-value="2eme" aria-pressed="true">2e renversement</button>
                    </div>
                </div>

                <div class="filter-group filter-group--roots">
                    <span class="filter-label">Fondamentale</span>
                    <div class="filter-buttons filter-buttons--roots" role="group" aria-label="Fondamentales de l'accord">
                        <button class="filter-button is-active" type="button" data-filter-group="root" data-value="all" aria-pressed="true">Toutes</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="C" aria-pressed="false">C</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="C#" aria-pressed="false">C#</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="Db" aria-pressed="false">Db</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="D" aria-pressed="false">D</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="D#" aria-pressed="false">D#</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="Eb" aria-pressed="false">Eb</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="E" aria-pressed="false">E</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="F" aria-pressed="false">F</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="F#" aria-pressed="false">F#</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="Gb" aria-pressed="false">Gb</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="G" aria-pressed="false">G</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="G#" aria-pressed="false">G#</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="Ab" aria-pressed="false">Ab</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="A" aria-pressed="false">A</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="A#" aria-pressed="false">A#</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="Bb" aria-pressed="false">Bb</button>
                        <button class="filter-button" type="button" data-filter-group="root" data-value="B" aria-pressed="false">B</button>
                    </div>
                </div>

                <p id="controls-hint" class="controls-hint" aria-live="polite">Les changements s'appliquent au prochain accord.</p>
            </section>

            <section class="chord-stage" aria-live="polite">
                <div class="question-card">
                    <span class="treble-clef" aria-hidden="true">𝄞</span>

                    <div class="question-copy">
                        <div id="random-values" class="random-value-container">
                            <div class="random-value">Initialisation…</div>
                        </div>
                        <div id="phase-label" class="phase-label">Préparation</div>
                    </div>

                    <span class="question-balance" aria-hidden="true"></span>
                </div>

                <div class="answer-zone">
                    <img id="chord-image" src="" alt="" hidden>
                    <p id="image-error" class="image-error" hidden>Image indisponible pour cet accord.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/chords_script.js?v=20261001-roots"></script>
</body>
</html>
