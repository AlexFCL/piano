<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices — Entraînement aux gammes</title>
    <link rel="stylesheet" href="css/scales_styles.css?v=20260928-2356">
</head>
<body class="training-page">
    <div class="app-shell training-shell">
        <header class="app-header">
            <a class="brand" href="index.html">Exercices</a>
            <div class="header-actions">
                <a class="header-link" href="scale_library.html">Toutes les gammes</a>
                <a class="header-link" href="index.html">← Retour</a>
            </div>
        </header>

        <main class="training-layout">
            <div class="training-heading">
                <div>
                    <p class="eyebrow">Générateur de gammes</p>
                    <h1>À toi de jouer</h1>
                </div>

                <label class="time-control" for="scale-update-time">
                    <span>Temps de réponse</span>
                    <span class="time-input">
                        <input id="scale-update-time" type="number" min="1" step="0.5" value="5" inputmode="decimal" aria-describedby="scale-controls-hint">
                        <span aria-hidden="true">s</span>
                    </span>
                </label>
            </div>

            <section class="filter-panel" aria-label="Sélection des gammes">
                <div class="filter-group">
                    <span class="filter-label">Type de gamme</span>
                    <div class="filter-buttons" role="group" aria-label="Types de gammes">
                        <button class="filter-button is-active" type="button" data-scale-filter="major" aria-pressed="true">Majeur</button>
                        <button class="filter-button is-active" type="button" data-scale-filter="minor" aria-pressed="true">Mineur</button>
                    </div>
                </div>

                <p id="scale-controls-hint" class="controls-hint" aria-live="polite">Les changements s'appliquent à la prochaine gamme.</p>
            </section>

            <section class="scale-stage" aria-live="polite">
                <div class="question-card">
                    <span class="treble-clef" aria-hidden="true">𝄞</span>
                    <div class="question-copy">
                        <div id="scale-name" class="scale-name">Initialisation…</div>
                        <div id="phase-label" class="phase-label">Préparation</div>
                    </div>
                    <span class="question-balance" aria-hidden="true"></span>
                </div>

                <div class="answer-zone">
                    <img id="scale-image" src="" alt="" hidden>
                    <p id="image-error" class="image-error" hidden>Image indisponible pour cette gamme.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/scales_script.js?v=20260928-2356"></script>
</body>
</html>
