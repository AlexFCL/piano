<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices — Théorie musicale</title>
    <link rel="stylesheet" href="css/library_styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="index.html">Exercices</a>
            <a class="header-link" href="theory.html">← Retour</a>
        </header>

        <main class="quiz-shell">
            <section class="page-intro quiz-intro">
                <p class="eyebrow">Théorie musicale</p>
                <h1 id="quiz-title">Trouver les notes d’une gamme</h1>
            </section>

            <section class="quiz-card">
                <div class="scale-question">
                    <span class="treble-clef">𝄞</span>
                    <span id="scale-question-text">Aucune gamme générée</span>
                </div>

                <div class="notes-inputs" id="notes-inputs"></div>

                <div class="quiz-actions">
                    <button class="primary-button" id="generate-scale-button">🎲 Générer</button>
                    <button class="secondary-button" id="check-scale-button" disabled>✓ Vérifier</button>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="js/theory_quiz.js"></script>
</body>
</html>
